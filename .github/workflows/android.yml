name: Android

on:
  push:
    branches: [main, android-*]
    tags: ['android-v*']
    paths: ['android/**', 'proxy/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'proxy/**', '.github/workflows/android.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test and build
        type: string
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Same pins as chaquopy.pip in android/app/build.gradle.kts.
      - name: Install core dependencies
        run: pip install "cryptography==42.0.8" "httpx[http2]==0.28.1" certifi pytest

      - name: Upstream core tests
        run: |
          # Skip tests that import the desktop tray/UI stack (psutil, customtkinter, ...).
          core_tests=$(grep -L -E 'tray_common|from ui|import ui|from utils|import utils|customtkinter|pystray|psutil' tests/test_*.py)
          echo "$core_tests"
          python -m pytest -q $core_tests

      - name: Android adapter tests
        run: python -m pytest -q android/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Chaquopy needs a build Python with the same major.minor as the app (3.13).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: AndMTProto-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v') && inputs.ref == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "AndMTProto-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "AndMTProto-${GITHUB_REF_NAME}.apk" \
            --title "AndMTProto ${GITHUB_REF_NAME#android-v}" --generate-notes
